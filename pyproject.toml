[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fermikan"
version = "0.1.0"
description = "Physics-Designed Kolmogorov-Arnold Networks for Neural QMC"
authors = [{ name = "Tomoaki Takamatsu" }]
dependencies = [
    "jax",
    "jaxlib",
    "dm-haiku",
    "optax"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["fermikan*"]
